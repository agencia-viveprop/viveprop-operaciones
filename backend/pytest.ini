[pytest]
testpaths = tests
pythonpath = .
addopts = -q
filterwarnings =
    # Los avisos de SQLAlchemy casi siempre marcan un problema real de orden o
    # de sesion, asi que rompen el test en vez de quedar en el resumen.
    error::sqlalchemy.exc.SAWarning
    # Ruido de terceros, fuera de nuestro control.
    ignore::DeprecationWarning:starlette.testclient
    ignore:Using `httpx` with `starlette.testclient` is deprecated
